[deps]
CairoMakie = "13f3f980-e62b-5c42-98c6-ff1f3baf88f0"
CompactBasisFunctions = "a09551c4-f815-4143-809e-dd1986753ba7"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
PoissonBrackets = "2a9ffa85-4e0d-473f-b05e-278d80d8d306"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
SimpleSolvers = "36b790f5-6434-4fbe-b711-1f64a1e2f6a2"
SimpleSplines = "ac480f6c-9a94-4d53-a283-9db69f109154"
SparseArrays = "2f01184e-e22b-5df5-ae63-d93ebab69eaf"
SymPyPythonCall = "bc8888f7-b21e-4b7c-a06a-5d9c9496438c"

# SimpleSplines is not yet registered, so it needs an explicit source. `[sources]` is a
# Julia 1.11 feature: on 1.10 it is ignored and resolution fails with "expected package
# SimpleSplines to be registered". That row of the CI matrix will not pass until SimpleSplines
# is released, at which point this whole block can go.
[sources]
PoissonBrackets = {path = ".."}
SimpleSplines = {rev = "main", url = "https://github.com/JuliaDEC/SimpleSplines.jl"}
# Repeated from the package's own `[sources]` rather than inherited: a relative source path is
# resolved against the *active* project, so the root's `../SimpleSolvers` becomes
# `PoissonBrackets/SimpleSolvers` when this environment is the active one, and resolution
# fails outright. Every nested environment needs its own copy, at its own depth.
#
# `path` rather than the root's `{rev = "main", url = ...}`: the url form resolves against a
# cached clone of the sibling repository, which pinned this environment to 0.12.2 while the
# working tree was already at the 0.13 the package requires. A local sibling is a path.
SimpleSolvers = {path = "../../SimpleSolvers"}
